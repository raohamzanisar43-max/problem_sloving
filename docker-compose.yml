name: novu-radar

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: db
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    environment:
      POSTGRES_HOST: db
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u, urllib.error as e
try: u.urlopen(u.Request('http://127.0.0.1:8000/api/v1/', headers={'X-Forwarded-Proto': 'https'}), timeout=3)
except e.HTTPError as x: raise SystemExit(x.code >= 500)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  scheduler:
    <<: *backend
    command: ["python", "run_scheduler.py"]
    depends_on:
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-3090}:80"
    depends_on:
      - backend

volumes:
  pgdata:
