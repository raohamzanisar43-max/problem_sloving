# novuradar.novulabs.net — Novu Opportunity Radar
# Everything goes to the compose "frontend" container on 127.0.0.1:3090, which serves the
# SPA and proxies /api, /admin and /static to Django.
# Installed on the host at /etc/nginx/sites-available/novuradar (symlinked into sites-enabled).

server {
    listen 80;
    listen [::]:80;
    server_name novuradar.novulabs.net;

    client_max_body_size 20M;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
